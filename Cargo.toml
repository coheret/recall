[workspace]
members = ["crates/recall-protocol", "crates/recall-core", "crates/recall-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Coheret"]
repository = "https://github.com/coheret/recall"
publish = false

[workspace.dependencies]
bytes = "=1.10.1"
tokio = { version = "=1.44.2", default-features = false }
subtle = "=2.6.1"
recall-protocol = { path = "crates/recall-protocol" }
recall-core = { path = "crates/recall-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

